services:
  - type: web
    name: razorpay-freshdesk-connector
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRESHDESK_MOCK_MODE
        value: "true"
      - key: CONNECTOR_API_KEY
        generateValue: true
      - key: FRESHDESK_DOMAIN
        value: "demo-merchant.freshdesk.com"
      - key: FRESHDESK_API_KEY
        value: "mock_api_key"
      - key: ENVIRONMENT
        value: "production"
